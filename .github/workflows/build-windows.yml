name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'build\\windows\\x64\\runner\\Release\\*' -DestinationPath 'AcademicInquiry-Windows-Portable.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: iscc installer\\windows_setup.iss

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: AcademicInquiry-Windows-Portable
          path: AcademicInquiry-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AcademicInquiry-Windows-Installer
          path: installer\\Output\\AcademicInquiry-Setup-2.0.0-win64.exe
          if-no-files-found: error
